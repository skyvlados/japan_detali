services:
  frontend:
    image: japandetali-frontend:local
    build:
      context: .
      args:
        VITE_SITE_SETTINGS_URL: ${VITE_SITE_SETTINGS_URL:-}
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
